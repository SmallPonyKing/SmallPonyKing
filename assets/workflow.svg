<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="144" viewBox="0 0 1200 144" role="img" aria-labelledby="title"><title id="title">Workflow: observe, reason, build, validate, iterate.</title><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#151e2b"/><stop offset="1" stop-color="#0c1017"/></linearGradient><linearGradient id="gold"><stop stop-color="#b49565"/><stop offset=".5" stop-color="#f1dfbe"/><stop offset="1" stop-color="#b49565"/></linearGradient><radialGradient id="glow"><stop stop-color="#dbc29a" stop-opacity=".12"/><stop offset="1" stop-color="#dbc29a" stop-opacity="0"/></radialGradient></defs><rect width="1200" height="144" rx="20" fill="#0c1017"/><rect x="1" y="1" width="1198" height="142" rx="20" fill="#0c1017" stroke="#2b3442"/><text x="30" y="33" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#dbc29a" font-weight="400" letter-spacing="2">THE WORKFLOW</text><path d="M80 76H1120" stroke="#344050"/><circle cx="80" cy="76" r="6" fill="#dbc29a"/><text x="80" y="115" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#f5f0e8" font-weight="400" text-anchor="middle">OBSERVE</text><circle cx="340" cy="76" r="6" fill="#dbc29a"/><text x="340" y="115" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#f5f0e8" font-weight="400" text-anchor="middle">REASON</text><circle cx="600" cy="76" r="6" fill="#dbc29a"/><text x="600" y="115" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#f5f0e8" font-weight="400" text-anchor="middle">BUILD</text><circle cx="860" cy="76" r="6" fill="#dbc29a"/><text x="860" y="115" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#f5f0e8" font-weight="400" text-anchor="middle">VALIDATE</text><circle cx="1120" cy="76" r="6" fill="#dbc29a"/><text x="1120" y="115" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#f5f0e8" font-weight="400" text-anchor="middle">ITERATE</text></svg>